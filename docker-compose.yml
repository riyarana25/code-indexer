services:
  go-analyzer:
    build: ./go
    env_file:
      - .env
    environment:
      - ROOT_NAME=go-project
      - BASE_URL=http://localhost
    volumes:
      - ./go:/app
    depends_on:
      - neo4j

  graphlang-analyzer:
    # Opt-in: its cleanup wipes the whole database, including other analyzers' data.
    # Run with: docker compose --profile graphlang up -d graphlang-analyzer
    profiles: ["graphlang"]
    platform: linux/amd64
    build: ./graphlang
    env_file:
      - .env
    environment:
      - ROOT_NAME=graphlang-project
      - BASE_URL=http://localhost
    volumes:
      - ./graphlang:/app
    depends_on:
      - neo4j

  python-analyzer:
    build: ./python
    env_file:
      - .env
    environment:
      - ROOT_NAME=python-project
      - BASE_URL=http://localhost
    volumes:
      - ./python:/app
    depends_on:
      - neo4j

  js-analyzer:
    build: ./js
    env_file:
      - .env
    environment:
      - ROOT_NAME=js-project
      - BASE_URL=http://localhost
    volumes:
      - ./js:/app
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:5-community
    # Bound to localhost only; not reachable from other machines on the network
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # Password is read from .env (NEO4J_PASSWORD); Neo4j's initial user is always "neo4j"
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
